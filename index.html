function mStrokeStart(p){
  mDrawNow(); const hit=mPick(p.x,p.y), a=md.asset, ap=activePart();
  if(mTool==='pick'){ if(hit){ const part=a.parts.find(q=>q.id===hit.pid), ci=rt(part).map.get(KEY(hit.x,hit.y,hit.z)); if(ci!=null){ setColor(fromHex(a.palette[ci])); toast('Couleur prélevée'); } } return; }
  if(mTool==='pivot'){ mSnapshot([ap]); const c=hit?[hit.x+.5,hit.y+.5,hit.z+.5]:groundVoxel(p.x,p.y).map(v=>v+.5); if(!hit) c[2]=0; ap.pivot=c; mCommit(); toast('Pivot placé'); return; }
  if((mTool==='remove'||mTool==='paint')&&hit&&hit.pid!==ap.id){ md.active=hit.pid; renderPartBar(); mDraw(); toast('Pièce active : '+a.parts.find(q=>q.id===hit.pid).name); return; }
  const partner=mMirror?partnerOf(ap):null; mSnapshot(partner?[ap,partner]:[ap]);
  mStroke={dir:null,plane:null,changed:false};
  mStrokeApply(hit,p);
}
function mStrokeApply(hit,p){
  let cells=null;
  if(mTool==='add'){
    let t, dir;
    if(hit){ dir=hit.d; const D=DIRS[dir]; t=[hit.x+D[0],hit.y+D[1],hit.z+D[2]]; } else if(mStroke.dir==null||mStroke.dir===4){ dir=4; t=groundVoxel(p.x,p.y); } else return;
    const ax=Math.floor(dir/2);
    if(mStroke.dir==null){ mStroke.dir=dir; mStroke.plane=t[ax]; } else if(mStroke.dir!==dir||t[ax]!==mStroke.plane) return;
    cells=brushCells(t[0],t[1],t[2],dir);
  } else if(hit&&hit.pid===md.active){ if(mStroke.dir==null){ mStroke.dir=hit.d; } cells=brushCells(hit.x,hit.y,hit.z,hit.d); }
  if(cells&&applyAt(cells,mTool)){ mStroke.changed=true; if(mTap) mTap.drew=true; mDrawNow(); }
}
function mStrokeMove(p){ mStrokeApply(mPick(p.x,p.y),p); }
function mStrokeEnd(){ if(mStroke.changed) mCommit(); else md.pending=null; mStroke=null; }
function mStrokeCancel(){ if(md.pending){ md.pending.forEach(s=>{ rt(s.p).map=s.map; bump(s.p); }); md.pending=null; } mStroke=null; mDraw(); }

/* ----- Aperçu animé (poses, 16 directions) ----- */
function renderMPreviewCtl(){
  const a=md.asset, poses=RIGS[a.rig].poses; if(!poses.some(p=>p[0]===mPose)) mPose='idle';
  $('#mPvModes').innerHTML=poses.map(([k,l])=>`<button data-p="${k}" class="${k===mPose?'on':''}">${l}</button>`).join('')+
    `<button data-h="-1" aria-label="Tourner à gauche">⟲</button><button data-spin="1" class="${mSpin?'on':''}">Rotation</button><button data-h="1" aria-label="Tourner à droite">⟳</button>`;
  $$('#mPvModes [data-p]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); mPose=b.dataset.p; md.t0=performance.now(); renderMPreviewCtl(); if(mMode!=='sculpt') mDraw(); });
  $$('#mPvModes [data-h]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); mHeading=(mHeading+ +b.dataset.h+16)%16; renderMPreviewCtl(); });
  $('#mPvModes [data-spin]').onclick=e=>{ e.stopPropagation(); mSpin=!mSpin; renderMPreviewCtl(); };
  $('#mPvNote').textContent=`Direction ${mHeading+1}/16 · comme en jeu, avec les mutations de l’individu test.`;
  $('#mPvLabel').textContent=poses.find(p=>p[0]===mPose)[1];
}
$('#mPreview').addEventListener('click',e=>{ if(e.target.closest('button')) return; if(window.innerWidth<700) $('#mPreview').classList.toggle('big'); });
let lastSpin=0;
(function mLoop(ts){
  if(md&&route.view==='editor'){
    if(mSpin&&ts-lastSpin>260){ mHeading=(mHeading+1)%16; lastSpin=ts; $('#mPvNote').textContent=`Direction ${mHeading+1}/16 · comme en jeu, avec les mutations de l’individu test.`; }
    const c=$('#mPreviewCanvas'), x=c.getContext('2d'); x.setTransform(1,0,0,1,0,0); x.fillStyle='#15191e'; x.fillRect(0,0,c.width,c.height);
    const t=(performance.now()-md.t0)/1000;
    // Cadrage stable : bornes calculées sur la pose debout.
    if(!md.pvB||md.pvKey!==mHeading+'|'+JSON.stringify(md.test)+md.asset.parts.length+rtVersion()){ const f=[]; collectFaces(md.asset,{ground:true,genes:md.test,pose:'idle',heading:mHeading},camProj({az:Math.PI/4,el:.72}),f); md.pvB=f.length?faceBounds(f):null; if(md.pvB){ const b=md.pvB, w=b[2]-b[0], h=b[3]-b[1]; md.pvB=[b[0]-w*.35,b[1]-h*.3,b[2]+w*.35,b[3]+h*.12]; } md.pvKey=mHeading+'|'+JSON.stringify(md.test)+md.asset.parts.length+rtVersion(); }
    // Ombre au sol.
    renderModelFit(x,md.asset,{x:0,y:0,w:c.width,h:c.height},{genes:md.test,pose:mPose,t,heading:mHeading,bounds:md.pvB||undefined,pad:.92});
    if(mMode!=='sculpt'&&!mPopulation&&mPose!=='idle') mDraw();
  }
  requestAnimationFrame(mLoop);
})(0);
function rtVersion(){ return md.asset.parts.reduce((s,p)=>s+rt(p).v,0); }

/* ----- Mode mutant ----- */
$('#mMutant').onclick=()=>{ mMode=mMode==='sculpt'?'mutant':'sculpt'; mPopulation=null; applyMode(); };
function applyMode(){
  const mut=mMode==='mutant'; $('#mMutant').classList.toggle('on',mut); $('#mMutant').innerHTML=mut?'✎<span> Sculpter</span>':'🧬<span> Mutations</span>';
  $('#mSculptPanel').classList.toggle('hidden',mut); $('#mGenesPanel').classList.toggle('hidden',!mut); $('#partBar').classList.toggle('hidden',mut);
  $('#mZoomBox').classList.toggle('hidden',!!mPopulation);
  if(mut) renderGenes(); mFit(); mDraw();
}
function geneTargetsLabel(g){ const T=GENE_TYPES[g.type]; if(T.global) return 'tout le corps'; const a=md.asset; const n=(g.targets||[]).map(id=>a.parts.find(p=>p.id===id)?.name).filter(Boolean); return n.length?n.join(', '):'aucune pièce choisie'; }
function fmtGene(g,v){ return g.type==='hue'?`${v>0?'+':''}${Math.round(v)}°`: g.type==='show'?(v>=.5?'présent':'absent'): g.type==='grow'?Math.round(v*100)+' %':'×'+(+v).toFixed(2); }
function renderGenes(){
  if(!md) return; const a=md.asset, box=$('#mGenesList'); a.genes=a.genes||[];
  $('#mGenesIntro').textContent = a.genes.length ? `${a.genes.length} mutation${a.genes.length>1?'s':''} possible${a.genes.length>1?'s':''} pour l’espèce « ${a.name} ». Règle les extrêmes, puis teste.` : 'Aucune mutation encore. Ajoute-en une pour définir comment les individus de cette espèce peuvent varier.';
  box.innerHTML='';
  a.genes.forEach((g,gi)=>{ const T=GENE_TYPES[g.type]; const card=document.createElement('div'); card.className='gene';
    const v=md.test[g.id]??g.base;
    card.innerHTML=`<div class="gene-head"><input class="gene-name" value="${esc(g.name)}" aria-label="Nom de la mutation"><button class="icon ghost" data-del aria-label="Supprimer la mutation">✕</button></div>
      <div class="gene-meta">${esc(T.label)} · <button class="linkbtn" data-tg>${esc(geneTargetsLabel(g))}</button></div>
      ${g.type==='show'?`<div class="gene-row"><span>Peut être</span><div class="seg small">${[['0','absente'],['both','variable'],['1','toujours']].map(([k,l])=>`<button data-sh="${k}" class="${(k==='both'&&g.min===0&&g.max===1)||(k==='0'&&g.max===0)||(k==='1'&&g.min===1)?'on':''}">${l}</button>`).join('')}</div></div>`:
      `<div class="gene-row"><span>Minimum</span><input type="range" data-k="min" min="${T.lo}" max="${T.hi}" step="${T.step}" value="${g.min}"><b>${fmtGene(g,g.min)}</b></div>
      <div class="gene-row"><span>Maximum</span><input type="range" data-k="max" min="${T.lo}" max="${T.hi}" step="${T.step}" value="${g.max}"><b>${fmtGene(g,g.max)}</b></div>`}
      <div class="gene-row test"><span>Test</span><input type="range" data-k="test" min="${Math.min(g.min,g.max)}" max="${Math.max(g.min,g.max)}" step="${T.step}" value="${v}"><b>${fmtGene(g,v)}</b></div>`;
    card.querySelector('.gene-name').onchange=e=>{ g.name=e.target.value.trim()||g.name; mDirty(); };
    card.querySelector('[data-del]').onclick=async()=>{ if(await confirmBox('Supprimer cette mutation ?',`« ${g.name} » ne pourra plus apparaître chez les individus.`,'Supprimer',true)){ a.genes.splice(gi,1); delete md.test[g.id]; mDirty(); renderGenes(); mDraw(); } };
    card.querySelector('[data-tg]').onclick=()=>{ if(!T.global) chooseTargets(g); };
    card.querySelectorAll('[data-sh]').forEach(b=>b.onclick=()=>{ const k=b.dataset.sh; [g.min,g.max]=k==='both'?[0,1]:k==='0'?[0,0]:[1,1]; g.base=g.max>=.5?1:0; md.test[g.id]=k==='both'?(md.test[g.id]??1):g.min; mDirty(); renderGenes(); mDraw(); });
    card.querySelectorAll('input[type=range]').forEach(r=>r.oninput=()=>{ const k=r.dataset.k, val=+r.value;
      if(k==='test') md.test[g.id]=val; else { g[k]=val; const lo=Math.min(g.min,g.max), hi=Math.max(g.min,g.max); md.test[g.id]=clamp(md.test[g.id]??g.base,lo,hi); mDirty(); }
      r.nextElementSibling.textContent=fmtGene(g,val); if(k!=='test'){ const t=card.querySelector('[data-k=test]'); t.min=Math.min(g.min,g.max); t.max=Math.max(g.min,g.max); t.value=md.test[g.id]; t.nextElementSibling.textContent=fmtGene(g,md.test[g.id]); }
      mDraw(); });
    box.appendChild(card); });
}
async function chooseTargets(g){
  const a=md.asset, sel=new Set(g.targets||[]);
  const v=await sheet(`<h3>Pièces concernées</h3><p>Les pièces attachées suivent automatiquement.</p><div class="chips" id="tgChips">${a.parts.map(p=>`<button class="chip ${sel.has(p.id)?'on':''}" data-id="${p.id}">${esc(p.name)}</button>`).join('')}</div><div class="acts"><button data-v="ok" class="primary">Valider</button></div>`,
    s=>s.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{ const id=b.dataset.id; sel.has(id)?sel.delete(id):sel.add(id); b.classList.toggle('on'); }));
  if(v==='ok'){ g.targets=[...sel]; mDirty(); renderGenes(); mDraw(); }
}
$('#mAddGene').onclick=async()=>{
  const v=await sheet(`<h3>Nouvelle mutation</h3><div class="menu-list">${Object.entries(GENE_TYPES).map(([k,T])=>`<button data-v="${k}"><span>🧬</span><div><b>${T.label}</b><br><small class="muted">${T.desc}</small></div></button>`).join('')}</div>`);
  if(!v) return; const T=GENE_TYPES[v], a=md.asset;
  const g={id:'g_'+uid().slice(-6), name:T.label.replace(/ \(.*\)/,''), type:v, targets:T.global?[]:[md.active], min:T.min, max:T.max, base:T.base};
  a.genes.push(g); md.test[g.id]=g.base; mDirty(); renderGenes(); mDraw();
  if(!T.global) chooseTargets(g);
};
const randGenes=()=>{ const o={}; (md.asset.genes||[]).forEach(g=>{ const T=GENE_TYPES[g.type], lo=Math.min(g.min,g.max), hi=Math.max(g.min,g.max); let v=lo+Math.random()*(hi-lo); if(g.type==='show') v=Math.random()<.5?lo:hi; v=Math.round(v/T.step)*T.step; o[g.id]=v; }); return o; };
$('#mRandom').onclick=()=>{ md.test=randGenes(); mPopulation=null; applyMode(); };
$('#mBase').onclick=()=>{ md.test={}; (md.asset.genes||[]).forEach(g=>md.test[g.id]=g.base); mPopulation=null; applyMode(); };
$('#mPop').onclick=()=>{ mPopulation=Array.from({length:9},randGenes); applyMode(); toast('Touche un individu pour l’étudier'); };
function popCells(w,h){ const n=mPopulation.length, cols=w>h?(n>6?5:3):3, rows=Math.ceil(n/cols), cw=w/cols, ch=(h-40)/rows; return mPopulation.map((g,i)=>({g,x:(i%cols)*cw,y:40+Math.floor(i/cols)*ch,w:cw,h:ch})); }
function drawPopulation(x,w,h){
  x.fillStyle='rgba(231,227,218,.8)'; x.font='13px system-ui'; x.fillText('Population simulée : 9 individus tirés au hasard dans tes plages de mutation',12,24);
  const cells=popCells(w,h); let common=null;
  // Même échelle pour tous : on compare vraiment les tailles.
  for(const c of cells){ const f=[]; collectFaces(md.asset,{ground:true,genes:c.g,heading:0},camProj({az:Math.PI/4,el:.72}),f); const b=faceBounds(f); c.b=b; if(!common) common=[b[2]-b[0],b[3]-b[1]]; else { common[0]=Math.max(common[0],b[2]-b[0]); common[1]=Math.max(common[1],b[3]-b[1]); } }
  for(const c of cells){ x.strokeStyle='rgba(255,255,255,.08)'; x.strokeRect(c.x+3,c.y+3,c.w-6,c.h-6);
    const zoom=Math.min(c.w*.8/common[0],c.h*.8/common[1]); const f=[]; collectFaces(md.asset,{ground:true,genes:c.g,heading:0},camProj({az:Math.PI/4,el:.72}),f);
    const b=c.b; drawFaces(x,f,zoom,c.x+c.w/2-((b[0]+b[2])/2)*zoom,c.y+c.h*.9-b[3]*zoom,false); }
}
function popTap(p){ const {w,h}=mStageSize(); const c=popCells(w,h).find(c=>p.x>=c.x&&p.x<c.x+c.w&&p.y>=c.y&&p.y<c.y+c.h); if(!c) return; md.test={...c.g}; mPopulation=null; applyMode(); renderGenes(); toast('Individu chargé dans le test'); }

/* ----- Menu du modèle ----- */
$('#mMenu').onclick=async()=>{
  if(!md) return; const a=md.asset;
  const v=await sheet(`<h3>${esc(a.name)}</h3><div class="menu-list">
    <button data-v="rig"><span>⚙</span>Squelette : ${RIGS[a.rig].label}</button>
    <button data-v="tags"><span>#</span>Tags</button>
    <button data-v="exp"><span>⇪</span>Exporter ce modèle</button>
    ${a.builtin?'<button data-v="orig"><span>↺</span>Revenir au modèle d’origine de Sonder</button>':''}
    <button data-v="clearall" class="danger"><span>✕</span>Tout effacer</button></div>`);
  if(v==='rig'){ const r=await sheet(`<h3>Squelette</h3><p>Il décide des poses d’animation disponibles.</p><div class="menu-list">${Object.entries(RIGS).map(([k,R])=>`<button data-v="${k}">${k===a.rig?'✓ ':''}${R.label}</button>`).join('')}</div>`); if(r){ a.rig=r; mDirty(); renderMPreviewCtl(); } }
  if(v==='tags'){ const n=await askText('Tags',(a.tags||[]).join(', '),'Enregistrer','ex. forêt, nocturne'); if(n!==null){ a.tags=parseTags(n); mDirty(); } }
  if(v==='exp'){ await mFlush(); exportAssets([a],a.name); }
  if(v==='orig'&&await confirmBox('Revenir à l’original ?','Tes modifications sur ce modèle seront remplacées par la version extraite du moteur.','Revenir',true)){
    const e=builtinCatalog().find(e=>e.key===a.builtin.key), n=await makeBuiltin(e); Object.assign(a,{parts:n.parts,palette:n.palette,genes:n.genes,rig:n.rig,vpu:n.vpu}); md.hist=[]; md.redo=[]; mDirty(); openModelEditor(a.id); }
  if(v==='clearall'&&await confirmBox('Tout effacer ?','Toutes les pièces seront vidées (annulable).','Effacer',true)){ mSnapshot(a.parts); a.parts.forEach(p=>{ rt(p).map.clear(); bump(p); }); mCommit(); }
};
window.addEventListener('keydown',e=>{ if(!md||route.view!=='editor'||e.target.tagName==='INPUT') return;
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){ e.preventDefault(); e.shiftKey?mSwap(md.redo,md.hist):mSwap(md.hist,md.redo); }
  const t={a:'add',r:'remove',p:'paint',i:'pick',o:'orbit'}[e.key]; if(t){ mTool=t; renderMTools(); } });

/* ================= Démarrage ================= */
(async function init(){
  try{ await DB.open(); assets=((await DB.all())||[]).map(normalizeAsset); const st=await DB.get('settings'); if(st) settings={...settings,...st}; }
  catch(e){ toast('Stockage indisponible : les assets ne seront pas conservés', 5000); }
  await migrateV01();
  try{ if((await DB.get('builtinSeed'))!==1){ await seedBuiltins(false); await DB.set('builtinSeed',1); } }catch(e){ console.warn(e); }
  try{ if(navigator.storage?.persist && !(await navigator.storage.persisted())) navigator.storage.persist(); }catch{}
  history.replaceState({view:'home'},''); go({view:'home'}, false);
  if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('service-worker.js').catch(()=>{});
})();
window.__sonder={ get ed(){return ed;}, get md(){return md;}, get assets(){return assets;} };
})();
</script>
